<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Fashion ERP Boutique</title>
  <meta name="description" content="Manage boutique profile, users, notifications, integrations, security, and system preferences." />

  <script>
    // Immediate router redirect to modular settings sub-pages
    (function () {
      var panelRoutes = {
        'boutique': 'company-profile/company-profile.html',
        'company': 'company-profile/company-profile.html',
        'company-profile': 'company-profile/company-profile.html',
        'branding': 'branding/branding.html',
        'theme': 'branding/branding.html',
        'regional': 'regional/regional.html',
        'currency': 'regional/regional.html',
        'branches': 'branches/branches.html',
        'locations': 'branches/branches.html',
        'users': 'users-roles/users-roles.html',
        'roles': 'users-roles/users-roles.html',
        'users-roles': 'users-roles/users-roles.html',
        'security': 'security/security.html',
        'access': 'security/security.html',
        'orders': 'orders-production/orders-production.html',
        'production': 'orders-production/orders-production.html',
        'orders-production': 'orders-production/orders-production.html',
        'notifications': 'notifications/notifications.html',
        'integrations': 'integrations/integrations.html',
        'data': 'data-backup/data-backup.html',
        'backup': 'data-backup/data-backup.html',
        'data-backup': 'data-backup/data-backup.html',
        'about': 'about/about.html',
        'license': 'about/about.html'
      };

      try {
        var params = new URLSearchParams(window.location.search);
        var panel = (params.get('panel') || '').toLowerCase().trim();
        var target = panelRoutes[panel] || 'company-profile/company-profile.html';
        window.location.replace(target);
      } catch (e) {
        window.location.replace('company-profile/company-profile.html');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0f0b;
      color: rgba(255, 255, 255, 0.7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .redirect-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 400px;
    }
    .redirect-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(184, 255, 61, 0.15);
      border-top-color: #b8ff3d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #b8ff3d;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-spinner"></div>
    <p style="margin: 0 0 12px; font-weight: 600; color: #fff;">Opening Settings...</p>
    <p style="font-size: 13px; margin: 0;">If you are not redirected automatically, <a href="company-profile/company-profile.html">click here to proceed</a>.</p>
  </div>
</body>
</html>
