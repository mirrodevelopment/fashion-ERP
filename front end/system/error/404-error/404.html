<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-brand-title="404 — Page Not Found">404 — Page Not Found</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved." />
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico" />
  <link rel="stylesheet" href="404.css" />
</head>
<body>

  <div class="error-page-wrapper">

    <!-- Ambient Glowing Atmospheric Background Layer -->
    <div class="ambient-bg" aria-hidden="true">
      <div class="glow-orb glow-orb-lime-top-left"></div>
      <div class="glow-orb glow-orb-lime-center"></div>
      <div class="glow-orb glow-orb-violet-right"></div>
      <div class="glow-orb glow-orb-bottom-left"></div>
      <div class="glow-orb glow-orb-bottom-right"></div>

      <!-- Glass Specular Rings -->
      <div class="glass-ring glass-ring-left"></div>
      <div class="glass-ring glass-ring-right"></div>
      <div class="glass-ring glass-ring-top"></div>
    </div>

    <!-- Header Navigation -->
    <header class="error-header">
      <a href="../../../dashboard/dashboard.html" class="brand-badge" id="brandLink">
        <!-- Brand Logo Mark -->
        <span class="brand-logo-mark-wrap" data-brand="logoMarkLime">
          <svg viewBox="0 0 24 24" fill="none" class="brand-logo-h" aria-label="Brand Logo">
            <rect x="3.5" y="2.5" width="5" height="11" rx="2.5" fill="#a3e635"/>
            <circle cx="6" cy="18.5" r="2.5" fill="#a3e635"/>
            <circle cx="18" cy="5.5" r="2.5" fill="#a3e635"/>
            <rect x="15.5" y="10.5" width="5" height="11" rx="2.5" fill="#a3e635"/>
          </svg>
        </span>
        <div class="brand-text-block">
          <span class="brand-title" data-brand="shortName"></span>
          <span class="brand-subtitle" data-brand="systemSub"></span>
        </div>
      </a>

      <a href="../../../dashboard/dashboard.html" class="back-home-btn" id="backHomeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Home</span>
      </a>
    </header>

    <!-- Main 404 Showcase -->
    <main class="error-main">
      
      <!-- Eyebrow Tag -->
      <div class="eyebrow-container">
        <span class="eyebrow-dash"></span>
        <span class="eyebrow-text">OOPS! SOMETHING’S MISSING</span>
        <span class="eyebrow-dash"></span>
      </div>

      <!-- 4 0 4 Display with Center Glowing Fashion Orb -->
      <div class="digits-row" aria-label="Error 404">
        <span class="digit-glass-4 digit-left">4</span>

        <!-- Center Glowing Hanger Orb (The '0') -->
        <div class="center-orb-wrapper">
          <div class="center-orb" title="Fashion Clothes Hanger">
            <!-- Minimalist Hanger Wireframe SVG -->
            <svg viewBox="0 0 64 52" class="hanger-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 21V15C32 11.6863 34.6863 9 38 9C41.3137 9 44 11.6863 44 15C44 17.5 42 19.5 39.5 20.5L32 24.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M32 24.5L8 38.5C6.5 39.4 6 41.2 7 42.5C7.8 43.5 9 44 10.5 44H53.5C55 44 56.2 43.5 57 42.5C58 41.2 57.5 39.4 56 38.5L32 24.5Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            </svg>
            <span class="mystery-mark">?</span>
          </div>
        </div>

        <span class="digit-glass-4 digit-right">4</span>
      </div>

      <!-- Headings -->
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-subtitle">
        The page you're looking for doesn't exist or may have been moved.<br />
        Let's get you back on track.
      </p>

      <!-- Action Buttons -->
      <div class="action-buttons-group">
        <a href="../../../dashboard/dashboard.html" class="btn-dashboard-primary" id="btnDashboard">
          <!-- House / Home Icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span>Go to Dashboard</span>
          <span style="font-size: 15px; margin-left: 2px;">&rarr;</span>
        </a>

        <button type="button" class="btn-search-pages" id="btnSearchPages" aria-haspopup="dialog">
          <!-- Search Magnifying Glass Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Search Pages</span>
        </button>
      </div>

    </main>

    <!-- Footer Quotes & Tagline -->
    <footer class="error-footer">
      <div class="footer-quote-wrap">
        <div class="footer-vertical-line"></div>
        <div>
          <p class="footer-quote-text">“Every path leads to a new possibility<br />in fashion and beyond.”</p>
          <div class="footer-quote-author">
            <span class="author-dash"></span>
            <span data-brand="shortNameUpper"></span>
          </div>
        </div>
      </div>

      <div class="footer-tagline-wrap">
        <div class="tagline-text" data-brand="slogan"></div>
        <div class="tagline-dash"></div>
      </div>
    </footer>

  </div>

  <!-- Search Pages Modal / Command Palette Overlay -->
  <div class="search-modal-backdrop" id="searchModal" role="dialog" aria-modal="true" aria-label="Search ERP Pages">
    <div class="search-modal-card">
      <div class="search-modal-header">
        <svg viewBox="0 0 24 24" fill="none" class="search-input-icon" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="searchPagesInput" placeholder="Search ERP pages (orders, inventory, fabrics, clients...)" autocomplete="off" />
        <button class="search-close-btn" id="searchCloseBtn" title="Close (ESC)">ESC</button>
      </div>

      <div class="search-results-list" id="searchResultsList">
        <!-- Dynamically populated by 404.js -->
      </div>

      <div class="search-modal-footer">
        <div><span>Tip: Use </span><kbd>&uarr;</kbd> <kbd>&darr;</kbd><span> to navigate</span></div>
        <div><span>Press </span><kbd>&crarr; Enter</kbd><span> to select</span></div>
      </div>
    </div>
  </div>

  <!-- Central Brand Identity & Universal Hydrator -->
  <script src="../../../fragments/brand-identity/brand-identity.js"></script>
  <!-- Brand & Universal Sync Bridge -->
  <script src="../../../fragments/company-bridge.js"></script>
  <script src="404.js"></script>
</body>
</html>
