spring:
  application:
    name: FASHION-ERP

  datasource:
    url: jdbc:postgresql://localhost:5432/fashion_erp
    username: postgres
    password: crazy@8
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 35MB
    max-swallow-size: 35MB
  error:
    include-message: always

logging:
  level:
    com.fashionerp: INFO
    org.flywaydb: INFO

jwt:
  # REQUIRED: Set JWT_SECRET env var to a strong random 32+ char value
  # Generate one: openssl rand -hex 32
  secret: ${JWT_SECRET:}

app:
  storage:
    # Base directory for uploaded files (customer avatars, order refs, garment images)
    # Override via APP_STORAGE_PATH env var in production
    base-path: ${APP_STORAGE_PATH:front end/assets}
  dev-tools:
    # Set to true ONLY for local development — NEVER in production
    enabled: ${DEV_TOOLS_ENABLED:false}
