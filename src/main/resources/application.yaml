spring:
  application:
    name: FASHION-ERP

  datasource:
    url: jdbc:postgresql://localhost:5432/fashion_erp
    username: postgres
    password: crazy@8
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.fashionerp: DEBUG
    org.flywaydb: INFO

jwt:
  secret: ${JWT_SECRET:HauloB0ut1queERPSecretKey2026XYZ!@#}
